[package]
name = "upm-windows"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.33", default-features = true }
egui = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
keyring = "3"
rand = "0.8"
upm-core = { path = "../../crates/upm-core" }
upm-crypto = { path = "../../crates/upm-crypto" }
upm-protocol = { path = "../../crates/upm-protocol" }
urlencoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
